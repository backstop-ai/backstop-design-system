        description: |
          Extend the executable safety driver before changing the classifier. Build a
          real temporary Git repository whose tagged candidate contains all five
          required publication logs, regenerate all five expected outputs, preserve
          byte-identical bytes for pack-check, pack-test, and public-site-acceptance,
          change only canonical-wordmark-v013-candidate and release-workflow-safety,
          and create the exact single-parent bot commit `Record v0.1.4 publication
          checks`. Assert the tree contains all five authenticated outputs while
          `git diff-tree` reports exactly those two changed paths. Run the old
          classifier and retain the substantive RED in
          `TestReleaseWorkflow_RegeneratedFiveLogsWithTwoChangedIsTerminalNoOp` and
          `TestReleaseWorkflow_PostTagLogDescendantAllowsByteIdenticalOutputs`; the
          failure must be its exact-five-path predicate, not malformed metadata.

          Add real-history positive evidence coverage and adversarial mutations under
          the exact mandated names
          `TestReleaseWorkflow_PostTagEvidenceDescendantAuthenticatesRequiredOutputs`,
          `TestReleaseWorkflow_RejectsArbitraryPublicationPathSubsets`,
          `TestReleaseWorkflow_RejectsPublicationContentAndIdentityMismatch`, and
          `TestReleaseWorkflow_ClassifierRegressionMatrixRetainsPolarity`. Mutate one
          dimension at a time: omitted/stale/forged required log bytes or hash,
          unexpected publication path, extra/missing parent, non-descendant, wrong
          Git author or committer name/email, wrong event actor, message, event
          metadata, tag/candidate/evidence binding, log-ref commit/path, result, or
          command. Preserve and execute the existing mismatch, same-candidate resume,
          ordering, manual-SHA, branch-head, command, and terminal-side-effect tests.
          Subset cardinality is never the oracle: the authentic two-path subset passes
          because all five descendant blobs authenticate, while each negative subset
          must pair its allowlisted diff with an explicit missing, stale, or forged
          required output (or another single authentication defect) and assert that
          specific fatal reason. Do not expect complete authentic state to fail merely
          because fewer than five paths changed.

          Add an existing-tag adversary that changes the descendant checkout's
          `scripts/classify-release-publication.py` into an always-noop authenticator.
          Give it an observable sentinel and prove the production launcher extracts
          and executes classifier bytes from the immutable tag: the sentinel never
          executes and the trusted classifier rejects the changed classifier path and
          malicious descendant. Also parse `release-evidence/template.yml` and require
          the candidate command to be exactly `python3
          scripts/verify-canonical-wordmark-v013.py --candidate --base v0.1.3`, with
          its conventional check/log identity intact. Assertions must execute the
          production launcher and inspect Git object bytes/hashes; do not reimplement
          its decision. Record exact RED/PASS output without skips or expected-failure
          wrappers.
        files:
          - scripts/verify-release-workflow-safety.py
          - release-evidence/template.yml
        claims:

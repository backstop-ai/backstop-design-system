  - id: phase-3
    name: "Phase 3: GREEN immutable-tag launcher and exact-SHA workflow"
    tasks:
      - id: TASK-004
        type: implementation
        title: "Execute immutable-tag classifier bytes for existing-tag descendants"
        description: |
          Fetch full history/tags before classification. If the release tag exists,
          resolve it to a commit, extract
          `scripts/classify-release-publication.py` directly from that immutable Git
          object into a runner-temporary path, verify/record its blob hash, and execute
          only those bytes for differing-SHA descendant classification. Never import
          or execute descendant-checkout classifier bytes. A same-candidate tag is
          byte-identical by definition. With no tag, candidate bytes may establish
          only `new-candidate`; they cannot authorize an existing-tag no-op. Keep all
          launcher inputs explicit and quoted.

          Bind workflow_run to its exact successful-main head SHA and manual dispatch
          to a required full SHA; verify checkout and detached worktree HEAD equal it,
          never current branch HEAD. Only new/resume modes run detached checks and
          reach tag operations; post-tag-noop only reports mode, and mismatch stops all
          checks/commits/tags/releases. Generate and explicitly stage all five logs,
          letting Git omit byte-identical files. Run the canonical check truthfully as
          `python3 scripts/verify-canonical-wordmark-v013.py --candidate --base v0.1.3`.
          Consume the already-GREEN template bytes owned by TASK-003; do not rewrite or
          assume ownership of them here.
          Preserve separate bot commits, independent post-evidence proof, pre-tag gate
          ordering, exact-SHA behavior if main moves, and no retag/force push.
        files:
          - .github/workflows/release.yml
        claims:
          - CLM-001
          - CLM-002
          - CLM-004
        depends_on:
          - TASK-001

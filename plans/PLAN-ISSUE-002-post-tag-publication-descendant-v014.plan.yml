  - id: phase-2
    name: "Phase 2: GREEN authenticated descendant classifier"
    tasks:
      - id: TASK-003
        type: implementation
        title: "Authenticate complete publication state across byte-identical outputs"
        description: |
          Replace exact changed-path equality without creating a path-only subset
          allowlist. Resolve the tag to its immutable commit and require the candidate
          to be that exact commit or an exact first-parent publication sequence. A log
          descendant has one parent equal to the tag commit; exact bot event actor,
          Git author and committer names/noreply email, and `Record <tag> publication
          checks` subject; and a nonempty changed-path set wholly contained in the five
          release log paths. Cardinality alone neither accepts nor rejects.

          Authenticate all five required logs at the descendant, whether changed or
          inherited. Define expected successful bytes in the immutable tagged release
          contract, derive SHA-256 from those trusted bytes, and compare `git show
          <commit>:<path>` bytes and hashes. Never derive expectations from the diff,
          descendant code, self-declared evidence, or changed subset. Thus the genuine
          two-path case passes, while each missing/stale/forged output fails for that
          explicit defect.

          Evidence descendants require one parent equal to the authenticated log
          commit, exact bot identity/message, and exactly the versioned evidence path
          changed. Validate full pack/tag/candidate/content-hash, owner, acceptance,
          command/check/result, log-ref and recomputed-hash bindings; reject
          self-reference and extra/missing checks. Preserve `new-candidate`, exact
          `resume-same-candidate`, and fatal mismatch for manual differing candidates,
          genuine later candidates, unrelated descendants and malformed sequences.

          In the same GREEN implementation, update the owned
          `release-evidence/template.yml` so its exact five conventional checks/log
          refs record `python3 scripts/verify-canonical-wordmark-v013.py --candidate
          --base v0.1.3`. This directly satisfies TASK-001's CLM-004 template RED
          before TASK-005 executes; do not defer or duplicate this write later.
        files:
          - scripts/classify-release-publication.py
          - release-evidence/template.yml
        claims:
          - CLM-001
          - CLM-002
          - CLM-003
          - CLM-004
        depends_on:
          - TASK-001


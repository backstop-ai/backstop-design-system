name: tag-integrity

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  tag-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install YAML parser
        run: python3 -m pip install --quiet --disable-pip-version-check pyyaml

      - name: Assert manifest version and tag agree
        env:
          PUSHED_TAG: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, sys, yaml

          with open("pack.yml", encoding="utf-8") as source:
              manifest = yaml.safe_load(source)
          version = str(manifest.get("version"))
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              sys.exit(f"::error file=pack.yml::invalid semantic version {version!r}")
          if os.environ["IS_TAG"] == "true":
              tag = os.environ["PUSHED_TAG"]
              if tag != f"v{version}":
                  sys.exit(f"::error file=pack.yml::{tag} does not match pack version {version}")
          print(f"pack version {version} is coherent")
          PY

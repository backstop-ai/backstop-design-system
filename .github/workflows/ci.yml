name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pack:
    name: Backstop Pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Backstop 0.2.0
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/backstop.tar.gz \
            https://github.com/backstop-ai/backstop-core/releases/download/v0.2.0/backstop_0.2.0_linux_amd64.tar.gz
          tar -xzf /tmp/backstop.tar.gz -C /tmp
          sudo install /tmp/backstop /usr/local/bin/backstop
          backstop version

      - name: Install the pinned findings engine
        run: python3 -m pip install --quiet --disable-pip-version-check semgrep==1.156.0

      - name: Prove every pack claim
        run: backstop pack test .

      - name: Check pack structure
        run: backstop pack check .

      - name: Verify public-site acceptance export
        run: python3 scripts/verify-public-site-acceptance.py

      - name: Validate v0.1.5 artifacts and complete gate
        run: |
          backstop artifact validate --issue ISSUE-003
          backstop artifact validate --plan PLAN-ISSUE-003
          backstop gate --all

      - name: Verify the v0.1.5 candidate contract
        run: python3 scripts/verify-canonical-wordmark-v015.py --candidate --base v0.1.4

      - name: Verify release workflow safety
        run: python3 scripts/verify-release-workflow-safety.py
